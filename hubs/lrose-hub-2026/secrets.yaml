imagePullSecret:
  create: true
  registry: xxx
  username: xxx
  password: xxx

hub:
  cookieSecret: xxx
  config:
    Authenticator:
      admin_users:
      - admins
      allowed_users:
      - users
      allow_existing_users: true
    JupyterHub:
      authenticator_class: github
    GitHubOAuthenticator:
     client_id: xxx
     client_secret: xxx
     oauth_callback_url: "https://lrosehub.ees200002.projects.jetstream-cloud.org/oauth_callback"

proxy:
  secretToken: xxx
  service:
    type: ClusterIP

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/middlewares.limit.buffering.maxRequestBodyBytes: '500000000'
  hosts:
  - lrosehub.ees200002.projects.jetstream-cloud.org
  tls:
  - hosts:
    - lrosehub.ees200002.projects.jetstream-cloud.org
    secretName: certmanager-tls-jupyterhub

scheduling:
  corePods:
    tolerations:
    - key: hub.jupyter.org/dedicated
      operator: Equal
      value: core
      effect: NoSchedule
    - key: hub.jupyter.org_dedicated
      operator: Equal
      value: core
      effect: NoSchedule
    nodeAffinity:
      matchNodePurpose: require
  podPriority:
    enabled: true
  userPlaceholder:
    replicas: 4

singleuser:
  nodeSelector:
    capi.stackhpc.com/node-group: mediums
  extraEnv:
    NBGITPULLER_DEPTH: '0'
    START_VIRTUAL_DESKTOP: '1'
  startTimeout: 600
  storage:
    type: none
    extraVolumes:
    - name: home-nfs
      persistentVolumeClaim:
        claimName: home-nfs
    extraVolumeMounts:
    - name: home-nfs
      mountPath: /home/jovyan
      subPath: '{username}'
    - name: "home-nfs"
      mountPath: "/share"
      subPath: "_shared"
  memory:
    guarantee: 13G
    limit: 16G
  cpu:
    guarantee: 3.25
    limit: 4
  defaultUrl: /lab
  image:
    name: nsflrose/gateway
    tag: "20250811"
  lifecycleHooks:
    postStart:
      exec:
        command:
        - bash
        - -c
        - |
          dir="/home/jovyan/.ssh"; [ -d $dir ] && { chmod 700 $dir && chmod -f 600 $dir/* && chmod -f 644 $dir/*.pub; } || true;
          cp -t /home/jovyan /Acknowledgements.ipynb /update_workshop_material.ipynb /lrose-nightly.ipynb;
          gitpuller https://github.com/nsf-lrose/lrose-hub main lrose-hub;
          [[ -f $HOME/.bashrc ]] || cp /.bashrc $HOME/;
          [[ -f $HOME/.profile ]] || cp /.profile $HOME/;
          [[ -f $HOME/.condarc ]] || cp /.condarc $HOME/;
          [ -d "/share" ] && [ ! -L ~/share ] && ln -s /share ~/share || true;
  profileList:
  - display_name: Standard
    description: Up to 2 CPU, 8GiB RAM
    kubespawner_override:
      mem_guarantee: 6.25G
      mem_limit: 8G
      cpu_guarantee: 1.5
      cpu_limit: 2
      node_selector:
        capi.stackhpc.com/node-group: mediums
    default: true
  - display_name: Medium Power
    description: Up to 4 CPU, 16GiB RAM
    kubespawner_override:
      mem_guarantee: 13G
      mem_limit: 16G
      cpu_guarantee: 3.25
      cpu_limit: 4
      node_selector:
        capi.stackhpc.com/node-group: mediums
  - display_name: High Power
    description: Up to 8 CPU, 32GiB RAM
    kubespawner_override:
      mem_guarantee: 26.5G
      mem_limit: 32G
      cpu_guarantee: 7
      cpu_limit: 8
      node_selector:
        capi.stackhpc.com/node-group: mediums
